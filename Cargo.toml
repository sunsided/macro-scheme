[package]
name = "macro-scheme"
description = "Bidirectional macro schemes: validation, decoding, encoders (LZ77, lex-parse) and exact minimization for tiny inputs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/sunsided/macro-scheme"
readme = "README.md"

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
proptest = "1"

[features]
arbitrary = ["dep:arbitrary"]

[[bench]]
name = "encoders"
harness = false
